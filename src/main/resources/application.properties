spring.application.name=Employee_Attendance_Management_System

spring.jpa.properties.jakarta.persistence.schema-generation.database.action=drop-and-create
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/attendance_system
spring.datasource.username=userspring
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor


