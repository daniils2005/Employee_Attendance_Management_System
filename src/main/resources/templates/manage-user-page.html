<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Users</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
	<body>
		<p>User options</p>
		<div class="header">
			<div class="other-buttons-container">
				<a th:href="@{/home}">
					<button>Home</button>
				</a>
				<a th:href="@{/attendance}">
					<button>My attendance</button>
				</a>
				<a th:href="@{/overtime}">
					<button>My overtime</button>
				</a>
				<a th:href="@{/vacation}">
					<button>My vacation</button>
				</a>
				<a th:href="@{/account}">
					<button>My user account</button>
				</a>
			</div>
			<form th:action="@{/logout}" method="post">
				<button type="submit" class="logout-button">Logout</button>
			</form>
		</div>
		<hr>
		<div th:if="${#authorization.expression('hasAuthority(''ADMIN'')')}">
		    <p>Admin options</p>
		    <a th:href="@{/manage/attendance}">
		        <button>Manage attendance</button>
		    </a>
		    <a th:href="@{/manage/overtime}">
		        <button>Manage overtime</button>
		    </a>
		    <a th:href="@{/manage/vacation}">
		        <button>Manage vacation</button>
		    </a>
		    <a th:href="@{/manage/department}">
		        <button>Manage department</button>
		    </a>
		    <a th:href="@{/manage/employee}">
		        <button>Manage employees</button>
		    </a>
		    <a th:href="@{/manage/user}">
		        <button>Manage users</button>
		    </a>
			<hr>
		</div>
	    <h1>Manage Users</h1>
		<h2>Reset password for user</h2>
		<form th:action="@{/manage/user/reset-password}" method="post">
			<input type="number" name="uid" placeholder="Enter user ID" min="1" required>
			<input type="password" name="newPassword" placeholder="Enter new password" required pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&^#()_\-+=])[A-Za-z\d@$!%*?&^#()_\-+=]{8,}$" title="Password must be at least 8 characters long and contain an uppercase letter, a lowercase letter, a number, and a special character.">
			<button type="submit">Reset</button>
		</form>
	    <h2>Search Users</h2>
	    <form th:action="@{/manage/user}" method="get">
	        <input type="number" name="uid" placeholder="Enter User ID">
	        <input type="text" name="username" placeholder="Enter username">
	        <button type="submit">Search</button>
	        <a th:href="@{/manage/user}"><button type="button">Reset</button></a>
	    </form>
	    <h2>Users</h2>
	    <form th:action="@{/manage/user}" method="get">
	        <label>Sort by:</label>
	        <select name="sort">
				<option value="eid">Employee ID</option>
	            <option value="username">Username</option>
				<option value="surname">Surname</option>
	            <option value="authority">Authority</option>
	        </select>
	        <label>Order:</label>
	        <select name="order">
	            <option value="asc">Ascending</option>
	            <option value="desc">Descending</option>
	        </select>
	        <button type="submit">Sort</button>
	    </form>
	    <table style="width: 100%; border-collapse: collapse;">
	        <tr>
	            <th style="border: 1px solid black;">User id</th>
	            <th style="border: 1px solid black;">Employee id</th>
	            <th style="border: 1px solid black;">Username</th>
				<th style="border: 1px solid black;">Employee name</th>
				<th style="border: 1px solid black;">Employee surname</th>
				<th style="border: 1px solid black;">Email</th>
				<th style="border: 1px solid black;">Phone number</th>
	            <th style="border: 1px solid black;">Authority</th>
				<th style="border: 1px solid black;">Action</th>
	        </tr>
	        <tr>
	            <form th:action="@{/manage/user/add}" method="post">
	                <td style="border: 1px solid black;" th:text="${lastUid}"></td>
	                <td style="border: 1px solid black;"><input type="number" min="1" name="eid" required></td>
					<td style="border: 1px solid black;"><input type="text" name="username" required pattern="^[A-Za-z0-9_]{3,}$" title="Username must be at least 3 characters long and contain only letters, numbers, and underscores."></td>
	                <td style="border: 1px solid black;"></td>
					<td style="border: 1px solid black;"></td>
	                <td style="border: 1px solid black;"></td>
					<td style="border: 1px solid black;"></td>
					<td style="border: 1px solid black;">				
						<select name="authority">
							<option value="ADMIN">ADMIN</option>
					        <option value="USER">USER</option>
						</select>
					</td>
	                <td style="border: 1px solid black;"><button type="submit">Add</button></td>
	            </form>
	        </tr>
	        <tr th:each="user : ${users}">
	            <form th:action="@{/manage/user/update-or-delete}" method="post">
					<td style="border: 1px solid black;"><input type="hidden" name="uid" th:value="${user.uid}" th:text="${user.uid}"></td>
					<td style="border: 1px solid black;"><input type="number" name="eid" th:value="${user.employee.eid}" min="1"></td>
					<td style="border: 1px solid black;"><input type="text" name="username" th:value="${user.username}" pattern="^[A-Za-z0-9_]{3,}$" title="Username must be at least 3 characters long and contain only letters, numbers, and underscores."></td>
					<td style="border: 1px solid black;"><input type="text" name="employeeName" th:value="${user.employee.name}" pattern="^[A-Z][a-zA-Z]{1,29}$" title="Name must start with a capital letter and contain only letters (2–30 characters)."></td>
					<td style="border: 1px solid black;"><input type="text" name="employeeSurname" th:value="${user.employee.surname}" pattern="^[A-Z][a-zA-Z]{1,29}$" title="Surname must start with a capital letter and contain only letters (2–30 characters)."></td>
					<td style="border: 1px solid black;"><input type="text" name="email" th:value="${user.employee.email}" pattern="^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$" title="Email is invalid."></td>
					<td style="border: 1px solid black;"><input type="text" name="phoneNumber" th:value="${user.employee.number}" pattern="^(\+371|371)?[2-9]\d{7}$" title="The phone number must be an 8 digit Latvian number."></td>
					<td style="border: 1px solid black;">			
						<select name="authority">
							<option value="ADMIN" th:selected="${user.authority.title == 'ADMIN'}">ADMIN</option>
					        <option value="USER" th:selected="${user.authority.title == 'USER'}">USER</option>
						</select>
					</td>
	                <td style="border: 1px solid black;"><button type="submit" name="action" value="save">Save</button><button type="submit" name="action" value="delete">Delete</button></td>
				</form>
	        </tr>
	    </table>
	</body>
</html>
