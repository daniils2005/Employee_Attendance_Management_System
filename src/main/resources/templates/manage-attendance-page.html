<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Attendance</title>
</head>

<body>

<!-- HOME -->
<a th:href="@{/home}">
    <button>Home</button>
</a>

<h1>Manage Attendance</h1>

<h2>Search Attendance</h2>

<form th:action="@{/manage/attendance}" method="get">

    <input type="number"
           name="id"
           placeholder="Enter Employee ID">

    <button type="submit">Search</button>

    <a th:href="@{/manage/attendance}">
        <button type="button">Reset</button>
    </a>

</form>

<hr>

<h2>Attendance</h2>

<div style="margin-bottom: 10px;">
    <a th:href="@{/attendance(sort='id')}">
        <button>Sort by ID</button>
    </a>

    <a th:href="@{/attendance(sort='date')}">
        <button>Sort by Date</button>
    </a>

    <a th:href="@{/attendance(sort='hours')}">
        <button>Sort by Hours</button>
    </a>
</div>

<table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;">

    <tr>
        <th style="border: 1px solid black;">Date</th>
        <th style="border: 1px solid black;">Hours Worked</th>
    </tr>

    <tr>
        <form th:action="@{/attendance}" method="post">

            <td style="border: 1px solid black;"
                th:text="${dateToday}">
            </td>

            <td style="border: 1px solid black;">
                <input type="number" step="0.5" min="0" name="hoursWorked" required>
            </td>

            <td style="border: 1px solid black;">
                <button type="submit">Add</button>
            </td>

        </form>
    </tr>

    <!-- LIST ATTENDANCE -->
    <tr th:each="attendance : ${attendances}">
        <td style="border: 1px solid black;"
            th:text="${attendance.workDate}">
        </td>

        <td style="border: 1px solid black;"
            th:text="${attendance.hoursWorked}">
        </td>
    </tr>
</table>

<hr>

<h2>Overtime</h2>

<div style="margin-bottom: 10px;">
    <a th:href="@{/overtime(sort='date')}">
        <button>Sort by Date</button>
    </a>

    <a th:href="@{/overtime(sort='hours')}">
        <button>Sort by Hours</button>
    </a>

    <a th:href="@{/overtime(sort='rate')}">
        <button>Sort by Rate</button>
    </a>
</div>

<!-- OVERTIME TABLE -->
<table style="width: 100%; border-collapse: collapse;">

    <tr>
        <th style="border: 1px solid black;">Date</th>
        <th style="border: 1px solid black;">Hours</th>
        <th style="border: 1px solid black;">Rate</th>
        <th style="border: 1px solid black;">Description</th>
        <th style="border: 1px solid black;">Status</th>
    </tr>

    <tr th:each="overtime : ${overtimes}">
        <td style="border: 1px solid black;"
            th:text="${overtime.date}">
        </td>

        <td style="border: 1px solid black;"
            th:text="${overtime.overtimeHours}">
        </td>

        <td style="border: 1px solid black;"
            th:text="${overtime.overtimeRate != null ? overtime.overtimeRate : 'Not assigned'}">
        </td>

        <td style="border: 1px solid black;"
            th:text="${overtime.description}">
        </td>

        <td style="border: 1px solid black;"
            th:text="${overtime.status}">
        </td>
    </tr>
</table>

</body>
</html>
